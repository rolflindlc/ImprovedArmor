name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Dump jar (temporary)
        run: |
          echo "JARB64-BEGIN"
          base64 -w 50000 build/libs/improvedarmor-0.1.0.jar | awk '{print "CHUNK " NR " " $0}'
          echo "JARB64-END"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: improvedarmor-jar
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
