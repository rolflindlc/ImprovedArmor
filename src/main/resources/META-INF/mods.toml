authors="Rolflin"
description='''Replaces the vanilla armor curve with a flat one: every armor point is worth the same amount of effective health,
and armor, Resistance and Protection enchantments add up instead of multiplying.
Works with the armor of any other mod. The optional client HUD shows where your protection comes from.'''

